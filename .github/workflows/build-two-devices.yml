name: Build HG5585F-CT + ZN504XG-D

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag
        required: true
        default: '2devices'
        type: string

permissions:
  contents: write

concurrency:
  group: build-two-devices
  cancel-in-progress: true

env:
  DEVICE_A: fiberhome_hg5585f-ct
  DEVICE_B: znxt_zn504xg-d

jobs:
  build:
    name: Build 2 devices (an7581)
    runs-on: ubuntu-24.04
    timeout-minutes: 360

    steps:
      - uses: actions/checkout@v4

      - name: Free build space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/share/boost
          sudo apt-get clean

      - name: Install build dependencies
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            asciidoc autoconf automake autopoint binutils bison build-essential \
            bzip2 ccache clang cmake cpio curl device-tree-compiler flex gawk \
            gettext git g++-multilib gcc-multilib gperf help2man intltool \
            libelf-dev libglib2.0-dev libgmp3-dev libltdl-dev libmpc-dev \
            libmpfr-dev libncurses-dev libpython3-dev libreadline-dev libssl-dev \
            libtool libyaml-dev lld llvm ninja-build p7zip-full patch pkgconf \
            python3 python3-docutils python3-pip python3-ply python3-pyelftools \
            qemu-utils re2c rsync scons squashfs-tools subversion swig texinfo \
            uglifyjs unzip wget xmlto xxd zlib1g-dev zstd

      - name: Cache downloads
        uses: actions/cache@v4
        with:
          path: dl
          key: ponwrt-dl-an7581-${{ hashFiles('feeds.conf.default', 'configs/*.config') }}
          restore-keys: |
            ponwrt-dl-an7581-

      - name: Install feeds
        run: |
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Configure (only two devices)
        run: |
          ./scripts/kconfig.pl + configs/an7581.config configs/release.config > .config
          # Disable every device profile except the two requested ones.
          # Lines are of the form: CONFIG_TARGET_DEVICE_airoha_an7581_DEVICE_<name>=y
          sed -i -E \
            '/^CONFIG_TARGET_DEVICE_airoha_an7581_DEVICE_(fiberhome_hg5585f-ct|znxt_zn504xg-d)=y$/! s/^CONFIG_TARGET_DEVICE_airoha_an7581_DEVICE_([^=]+)=y$/# CONFIG_TARGET_DEVICE_airoha_an7581_DEVICE_\1 is not set/' \
            .config
          make defconfig
          # Enforce once more in case defconfig restored Kconfig defaults.
          sed -i -E \
            '/^CONFIG_TARGET_DEVICE_airoha_an7581_DEVICE_(fiberhome_hg5585f-ct|znxt_zn504xg-d)=y$/! s/^CONFIG_TARGET_DEVICE_airoha_an7581_DEVICE_([^=]+)=y$/# CONFIG_TARGET_DEVICE_airoha_an7581_DEVICE_\1 is not set/' \
            .config
          echo "=== Enabled device profiles ==="
          grep '^CONFIG_TARGET_DEVICE_airoha_an7581_DEVICE_.*=y' .config || true
          count=$(grep -c '^CONFIG_TARGET_DEVICE_airoha_an7581_DEVICE_.*=y' .config || true)
          if [ "$count" -ne 2 ]; then
            echo "ERROR: expected exactly 2 enabled device profiles, got $count"
            exit 1
          fi
          echo "=== Target ==="
          grep -E '^CONFIG_TARGET_(BOARD|SUBTARGET)=' .config

      - name: Download sources
        run: make download -j"$(nproc)"

      - name: Build
        run: make -j"$(nproc)"

      - name: Collect firmware files
        run: |
          mkdir -p out
          src="bin/targets/airoha/an7581"
          find "$src" -maxdepth 1 -type f \
            \( -name "*hg5585f-ct*" -o -name "*zn504xg-d*" \) \
            -exec cp -v {} out/ \;
          echo "=== Collected files ==="
          ls -lh out/
          test -n "$(ls -A out)" || { echo "No firmware files found"; exit 1; }
          tar --zstd -cf "ponwrt-2devices.tar.zst" -C out .
          (cd out && sha256sum * > ../sha256sums)

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ponwrt-2devices
          path: |
            ponwrt-2devices.tar.zst
            sha256sums
          if-no-files-found: error
          retention-days: 30

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          gh release create "$RELEASE_TAG" \
            ponwrt-2devices.tar.zst sha256sums \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "PonWrt 2 devices $RELEASE_TAG" \
            --notes "Only fiberhome_hg5585f-ct and znxt_zn504xg-d (AN7581)." \
            --prerelease
