name: Build 3 devices (AN7581)

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag
        required: true
        default: '3devices'
        type: string

permissions:
  contents: write

concurrency:
  group: build-three-devices
  cancel-in-progress: true

env:
  TARGET_DIR: airoha/an7581
  DEVICE_REGEX: 'fiberhome_hg5585f-ct|znxt_zn504xg-d|znxt_zn515xg-d'

jobs:
  build:
    name: Build 3 devices (an7581)
    runs-on: ubuntu-24.04
    timeout-minutes: 360

    steps:
      - uses: actions/checkout@v4

      - name: Free build space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/share/boost
          sudo apt-get clean

      - name: Install build dependencies
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            asciidoc autoconf automake autopoint binutils bison build-essential \
            bzip2 ccache clang cmake cpio curl device-tree-compiler dwarves flex gawk \
            gettext git g++-multilib gcc-multilib gperf help2man intltool \
            libbpf-dev libclang-dev libelf-dev libglib2.0-dev libgmp3-dev \
            libltdl-dev libmpc-dev \
            libmpfr-dev libncurses-dev libpython3-dev libreadline-dev libssl-dev \
            libtool libyaml-dev lld llvm ninja-build p7zip-full patch pkgconf \
            python3 python3-docutils python3-pip python3-ply python3-pyelftools \
            qemu-utils re2c rsync scons squashfs-tools subversion swig texinfo \
            uglifyjs unzip wget xmlto xxd zlib1g-dev zstd

      - name: Add luci-app-easytier + easytier from upstream
        run: |
          git clone --depth=1 https://github.com/EasyTier/luci-app-easytier.git /tmp/et
          mkdir -p package/luci-app-easytier package/easytier
          cp -rf /tmp/et/luci-app-easytier/* package/luci-app-easytier/
          cp -rf /tmp/et/easytier/* package/easytier/
          echo "=== added ==="
          ls package/luci-app-easytier package/easytier

      - name: Add iptv-fix package (from pzzfl/BrightSpeed-XG2010G)
        run: |
          mkdir -p package/iptv-fix/files/etc/init.d package/iptv-fix/files/usr/libexec

          cat > package/iptv-fix/Makefile <<'EOF'
          include $(TOPDIR)/rules.mk

          PKG_NAME:=iptv-fix
          PKG_VERSION:=1.0
          PKG_RELEASE:=1

          include $(INCLUDE_DIR)/package.mk

          define Package/iptv-fix
          SECTION:=net
          CATEGORY:=Network
          TITLE:=IPTV multicast fix for VLAN subinterface bridge topology
          DEPENDS:=+nftables +tcpdump
          endef

          define Package/iptv-fix/description
          Fixes IPTV multicast flooding on AN7581 devices with VLAN subinterfaces as bridge ports.
          Disables kernel IGMP snooping, disables MAC learning on multicast VLAN port, and
          installs a userspace IGMP snooper that dynamically manages nftables sets to only
          forward currently-watched channels.
          endef

          define Build/Compile
          endef

          define Package/iptv-fix/install
          	$(INSTALL_DIR) $(1)/usr/libexec
          	$(INSTALL_BIN) ./files/usr/libexec/iptv-snoop $(1)/usr/libexec/
          	$(INSTALL_DIR) $(1)/etc/init.d
          	$(INSTALL_BIN) ./files/etc/init.d/zz-iptv-fix $(1)/etc/init.d/
          	$(INSTALL_BIN) ./files/etc/init.d/zz-iptv-snoop $(1)/etc/init.d/
          	$(INSTALL_DIR) $(1)/etc
          	$(INSTALL_DATA) ./files/etc/iptv-snoop.nft $(1)/etc/
          endef

          $(eval $(call BuildPackage,iptv-fix))
          EOF

          cat > package/iptv-fix/files/etc/init.d/zz-iptv-fix <<'EOF'
          #!/bin/sh /etc/rc.common
          # IPTV 桥接修正：
          #  1) 关闭 IGMP snooping —— 内核 snooping 对"从 VLAN 子接口进来的 IGMP"
          #     登记不上 MDB，导致组播不转发；关掉改成泛洪即可
          #  2) 关闭组播 VLAN 端口的 MAC 学习 —— 否则组播流的源 MAC（网关）会被学在
          #     ct-iptv-mc 上，机顶盒发往网关的单播包会被桥错误地转到组播 VLAN 并丢弃，
          #     表现为 EPG/认证走不通、机顶盒卡在 85%
          START=99
          STOP=01

          start() {
          	i=0
          	while [ $i -lt 30 ]; do
          		[ -d /sys/class/net/br-iptv/brif/ct-iptv-mc ] && break
          		i=$((i+1)); sleep 1
          	done
          	[ -d /sys/class/net/br-iptv ] || return 0

          	echo 0 > /sys/class/net/br-iptv/bridge/multicast_snooping 2>/dev/null
          	bridge link set dev ct-iptv-mc learning off 2>/dev/null
          	bridge link set dev ct-iptv-mc mcast_flood on 2>/dev/null
          	logger -t iptv-fix "snooping=0, ct-iptv-mc learning off applied"
          }

          boot() { start "$@"; }
          EOF

          cat > package/iptv-fix/files/etc/init.d/zz-iptv-snoop <<'EOF'
          #!/bin/sh /etc/rc.common
          START=99
          USE_PROCD=1

          start_service() {
          	procd_open_instance
          	procd_set_param command /usr/libexec/iptv-snoop
          	procd_set_param respawn 3600 5 0
          	procd_set_param stdout 1
          	procd_set_param stderr 1
          	procd_close_instance
          }
          EOF

          cat > package/iptv-fix/files/etc/iptv-snoop.nft <<'EOF'
          table bridge iptv_snoop {
          	set subs {
          		type ipv4_addr
          		flags timeout
          	}
          	chain grpfilter {
          		type filter hook forward priority 10; policy accept;
          		iifname "ct-iptv-mc" oifname "lan3" ip protocol igmp accept
          		iifname "ct-iptv-mc" oifname "lan3" ip daddr 224.0.0.1 accept
          		iifname "ct-iptv-mc" oifname "lan3" ip daddr 239.255.255.250 accept
          		iifname "ct-iptv-mc" oifname "lan3" ip daddr @subs counter accept
          		iifname "ct-iptv-mc" oifname "lan3" ip daddr 224.0.0.0/4 counter drop
          	}
          }
          EOF

          cat > package/iptv-fix/files/usr/libexec/iptv-snoop <<'EOF'
          #!/bin/sh
          SET="bridge iptv_snoop subs"
          CUR=""

          is_video_group() {
          	case "$1" in
          	239.255.255.250) return 1 ;;
          	224.*) return 1 ;;
          	22[4-9].*|23[0-9].*) return 0 ;;
          	esac
          	return 1
          }

          while [ ! -d /sys/class/net/br-iptv ]; do sleep 2; done
          sleep 8

          nft delete table bridge iptv_snoop 2>/dev/null
          nft -f /etc/iptv-snoop.nft 2>/dev/null || exit 1
          logger -t iptv-snoop "filter armed"

          timeout 3 tcpdump -i ct-iptv-mc -n -q 'ip multicast' 2>/dev/null \
          | awk '{for(i=1;i<=NF;i++) if($i==">"){g=$(i+1); sub(/:.*/,"",g); sub(/\.[0-9]+$/,"",g); print g}}' \
          | grep -E '^22[4-9]\.|^23[0-9]\.' | sort -u > /tmp/iptv-groups.txt
          n=0
          while read -r g; do
          	nft add element $SET "{ $g }" 2>/dev/null && n=$((n+1))
          done < /tmp/iptv-groups.txt
          logger -t iptv-snoop "stage1: seeded $n groups"

          tcpdump -i br-iptv -n -l igmp 2>/dev/null | while read -r line; do
          	case "$line" in
          	*" report "*)
          		g=$(printf '%s' "$line" | sed -n 's/.* report \([0-9]\{1,3\}\(\.[0-9]\{1,3\}\)\{3\}\).*/\1/p')
          		[ -n "$g" ] || continue
          		is_video_group "$g" || continue
          		[ "$g" = "$CUR" ] && continue
          		nft flush set $SET 2>/dev/null
          		nft add element $SET "{ $g timeout 12h }" 2>/dev/null
          		CUR="$g"
          		logger -t iptv-snoop "tracking channel group $g"
          		;;
          	esac
          done
          EOF

          chmod +x package/iptv-fix/files/usr/libexec/iptv-snoop
          chmod +x package/iptv-fix/files/etc/init.d/zz-iptv-fix
          chmod +x package/iptv-fix/files/etc/init.d/zz-iptv-snoop

          echo "=== iptv-fix package created ==="
          find package/iptv-fix -type f | sort

      - name: Cache downloads
        uses: actions/cache@v4
        with:
          path: dl
          key: ponwrt-dl-an7581-3dev-${{ hashFiles('feeds.conf.default', 'configs/*.config') }}
          restore-keys: |
            ponwrt-dl-an7581-

      - name: Install feeds
        run: |
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      # honk-core is written in Rust + eBPF and is built by the honk package.
      # Its helper script resolves the pinned zig / bpf-linker versions from
      # the feed's Makefile, so install them before the real build starts.
      
      - name: Configure (only three devices)
        run: |
          # NOTE: in scripts/kconfig.pl the '+' operator is BINARY (merges exactly
          # two configs). To merge THREE files we must nest it as '+ A + B C',
          # otherwise the 3rd file is left unparsed and kconfig.pl dies with
          # "Parse error". Priority: three-devices.config (highest) > release.config > an7581.config.
          ./scripts/kconfig.pl + configs/an7581.config + configs/release.config configs/three-devices.config > .config
          # Belt and braces: the VERSION_* prompts are only visible when IMAGEOPT
          # is enabled, so also patch the fallback in include/version.mk.
          sed -i 's|https://downloads.immortalwrt.org/snapshots|https://mirror.nju.edu.cn/immortalwrt/snapshots|g' include/version.mk
          # Disable every device profile except the three requested ones.
          sed -i -E \
            "/^CONFIG_TARGET_DEVICE_airoha_an7581_DEVICE_(${DEVICE_REGEX})=y$/! s/^CONFIG_TARGET_DEVICE_airoha_an7581_DEVICE_([^=]+)=y$/# CONFIG_TARGET_DEVICE_airoha_an7581_DEVICE_\1 is not set/" \
            .config
          make defconfig
          # Enforce once more in case defconfig restored Kconfig defaults.
          sed -i -E \
            "/^CONFIG_TARGET_DEVICE_airoha_an7581_DEVICE_(${DEVICE_REGEX})=y$/! s/^CONFIG_TARGET_DEVICE_airoha_an7581_DEVICE_([^=]+)=y$/# CONFIG_TARGET_DEVICE_airoha_an7581_DEVICE_\1 is not set/" \
            .config
          echo "=== Enabled device profiles ==="
          grep '^CONFIG_TARGET_DEVICE_airoha_an7581_DEVICE_.*=y' .config || true
          count=$(grep -c '^CONFIG_TARGET_DEVICE_airoha_an7581_DEVICE_.*=y' .config || true)
          if [ "$count" -ne 3 ]; then
            echo "ERROR: expected exactly 3 enabled device profiles, got $count"
            exit 1
          fi
          echo "=== Firmware package source (软件源) ==="
          grep -n 'mirror.nju.edu.cn' include/version.mk | head -2
          grep -E '^CONFIG_VERSION(OPT|_DIST|_REPO)=' .config || true
          grep -q 'mirror.nju.edu.cn/immortalwrt' include/version.mk \
            || { echo "ERROR: include/version.mk does not point at the NJU mirror"; exit 1; }
          echo "=== honk needs kernel BTF ==="
          grep -q '^CONFIG_KERNEL_DEBUG_INFO_BTF=y' .config \
            || { echo "ERROR: CONFIG_KERNEL_DEBUG_INFO_BTF is not enabled, honk will not work"; exit 1; }
          echo "=== Requested packages (post-defconfig) ==="
          for p in curl unzip luci-app-ttyd luci-i18n-ttyd-zh-cn luci-app-filemanager luci-i18n-filemanager-zh-cn rtp2httpd luci-app-rtp2httpd luci-i18n-rtp2httpd-zh-cn luci-app-frpc luci-i18n-frpc-zh-cn easytier luci-app-easytier luci-i18n-easytier-zh-cn iptv-fix; do
            if grep -qE "^CONFIG_PACKAGE_${p}=y" .config; then echo "OK   $p"; else echo "MISS $p"; fi
          done
          echo "=== luci-app-wol must be gone ==="
          if grep -qE '^CONFIG_PACKAGE_luci-app-wol=y' .config \
             || grep -qE '^CONFIG_PACKAGE_luci-i18n-wol-zh-cn=y' .config; then
            echo "ERROR: wol is still enabled"; exit 1
          fi

      - name: Download sources
        run: make download -j"$(nproc)"

      - name: Build
        run: |
          set -o pipefail
          make -j"$(nproc)" || {
            echo "===== parallel build failed; retrying with -j1 V=s for diagnostics ====="
            make -j1 V=s
          }

      - name: Collect firmware files
        run: |
          mkdir -p out
          src="bin/targets/${TARGET_DIR}"
          find "$src" -maxdepth 1 -type f \
            \( -name "*hg5585f-ct*" -o -name "*zn504xg-d*" -o -name "*zn515xg-d*" \) \
            -exec cp -v {} out/ \;
          echo "=== Collected files ==="
          ls -lh out/
          test -n "$(ls -A out)" || { echo "No firmware files found"; exit 1; }
          tar --zstd -cf "ponwrt-3devices.tar.zst" -C out .
          (cd out && sha256sum * > ../sha256sums)

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ponwrt-3devices
          path: |
            ponwrt-3devices.tar.zst
            sha256sums
          if-no-files-found: error
          retention-days: 30

      - name: Create release
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          NOTES=$(printf '%s\n' \
            "Only fiberhome_hg5585f-ct, znxt_zn504xg-d, znxt_zn515xg-d (AN7581)." \
            "Packages: +rtp2httpd/luci-app-rtp2httpd, -luci-app-wol, \
            "+iptv-fix (IPTV multicast fix from pzzfl/BrightSpeed-XG2010G)." \
            "Package source: https://mirror.nju.edu.cn/immortalwrt/snapshots")
          gh release create "$RELEASE_TAG" \
            ponwrt-3devices.tar.zst sha256sums \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "PonWrt 3 devices $RELEASE_TAG" \
            --notes "$NOTES" \
            --prerelease
